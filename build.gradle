plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'jacoco'
    // id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0' // This plugin is often applied in settings.gradle, but if used here, ensure it works or configure repositories manually below.
}

group = 'com.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url "https://maven.aliyun.com/repository/public" } // 镜像
}

configurations.all {
    resolutionStrategy {
        force 'net.bytebuddy:byte-buddy:1.17.1'
        force 'net.bytebuddy:byte-buddy-agent:1.17.1'
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
        resources {
            srcDirs = ['test']
        }
    }
}


dependencies {
    implementation 'org.openjfx:javafx-controls:23.0.1'
    implementation 'org.openjfx:javafx-fxml:23.0.1'
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    implementation 'org.slf4j:slf4j-simple:2.0.16'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation('org.mockito:mockito-core:5.14.2') {
        exclude group: 'net.bytebuddy'
    }
    testImplementation('org.mockito:mockito-junit-jupiter:5.14.2') {
        exclude group: 'net.bytebuddy'
    }
    testImplementation 'net.bytebuddy:byte-buddy:1.17.1'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.17.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

javafx {
    version = '23.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'MainApp'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Explicitly configure toolchain repositories if the foojay plugin is not sufficient or applied in settings.gradle
// Note: In newer Gradle versions, this is usually done in settings.gradle, but for a single build file fix:
/*
toolchain {
    repositories {
        mavenCentral() 
    }
}
*/


tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

test {
    useJUnitPlatform()
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-opens', 'java.base/java.io=ALL-UNNAMED',
            '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens', 'java.base/sun.security.ssl=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util.concurrent=ALL-UNNAMED',
            '--add-opens', 'java.base/java.net=ALL-UNNAMED',
            '-XX:+EnableDynamicAgentLoading',
            '-Dnet.bytebuddy.experimental=true'
}

jacocoTestReport {
    dependsOn test // 生成报告前先运行测试
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}