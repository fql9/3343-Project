plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'jacoco'
    // id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0' // This plugin is often applied in settings.gradle, but if used here, ensure it works or configure repositories manually below.
}

group = 'com.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = "https://maven.aliyun.com/repository/public" } // 镜像
}

configurations.all {
    resolutionStrategy {
        force 'net.bytebuddy:byte-buddy:1.17.1'
        force 'net.bytebuddy:byte-buddy-agent:1.17.1'
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            exclude 'test/**'
        }
        resources {
            srcDirs = ['src']
            exclude 'test/**'
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/java']
        }
    }
}

// Task to run only unit tests (from test/unit directory)
tasks.register('unitTest', Test) {
    description = 'Runs unit tests only (from test/unit directory).'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Unit tests: ValidationUtilsTest, PasswordUtilsTest, ItemServiceTest, FavoriteServiceTest
    filter {
        includeTestsMatching 'util.ValidationUtilsTest'
        includeTestsMatching 'util.PasswordUtilsTest'
        includeTestsMatching 'service.ItemServiceTest'
        includeTestsMatching 'service.FavoriteServiceTest'
    }
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '-XX:+EnableDynamicAgentLoading',
            '-Dnet.bytebuddy.experimental=true'
}

// Task to run only integration tests (from test/integration directory)
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests only (from test/integration directory).'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Integration tests: all DAO, service (except ItemService/FavoriteService), config, ExportUsers
    filter {
        includeTestsMatching 'config.DatabaseConfigTest'
        includeTestsMatching 'dao.impl.*'
        includeTestsMatching 'service.UserServiceTest'
        includeTestsMatching 'service.MessageServiceTest'
        includeTestsMatching 'service.OrderServiceTest'
        includeTestsMatching 'service.ReviewServiceTest'
        includeTestsMatching 'service.NotificationServiceTest'
        includeTestsMatching 'util.ExportUsersTest'
    }
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-opens', 'java.base/java.io=ALL-UNNAMED',
            '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
            '-XX:+EnableDynamicAgentLoading',
            '-Dnet.bytebuddy.experimental=true'
}


dependencies {
    implementation 'org.openjfx:javafx-controls:23.0.1'
    implementation 'org.openjfx:javafx-fxml:23.0.1'
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    implementation 'org.slf4j:slf4j-simple:2.0.16'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation('org.mockito:mockito-core:5.14.2') {
        exclude group: 'net.bytebuddy'
    }
    testImplementation('org.mockito:mockito-junit-jupiter:5.14.2') {
        exclude group: 'net.bytebuddy'
    }
    testImplementation 'net.bytebuddy:byte-buddy:1.17.1'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.17.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

javafx {
    version = '23.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'MainApp'
}

java {
    toolchain {
        // JavaFX 23.0.1 requires Java 21+
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Set encoding to UTF-8 for all Java compilation tasks
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked']
}

// Explicitly configure toolchain repositories if the foojay plugin is not sufficient or applied in settings.gradle
// Note: In newer Gradle versions, this is usually done in settings.gradle, but for a single build file fix:
/*
toolchain {
    repositories {
        mavenCentral() 
    }
}
*/


tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

test {
    useJUnitPlatform()
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-opens', 'java.base/java.io=ALL-UNNAMED',
            '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens', 'java.base/sun.security.ssl=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util.concurrent=ALL-UNNAMED',
            '--add-opens', 'java.base/java.net=ALL-UNNAMED',
            '-XX:+EnableDynamicAgentLoading',
            '-Dnet.bytebuddy.experimental=true'
}

jacocoTestReport {
    dependsOn test // 生成报告前先运行测试
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'util/DialogUtils.class',  // JavaFX UI class - requires TestFX
                'controller/**',           // Controllers require TestFX
                'MainApp.class'             // Main application class
            ])
        }))
    }
}

// ===========================
// Executable File Generation
// ===========================

// Configure JAR manifest
jar {
    manifest {
        attributes(
            'Main-Class': 'MainApp',
            'Implementation-Title': 'CS3343 Second-Hand Trading Platform',
            'Implementation-Version': version,
            'Class-Path': configurations.runtimeClasspath.files.collect { "lib/${it.name}" }.join(' ')
        )
    }
}

// Create FAT JAR with all dependencies
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Create executable FAT JAR with all dependencies'
    archiveBaseName = '3343-Project'
    archiveClassifier = 'all'
    manifest {
        attributes(
            'Main-Class': 'MainApp',
            'Implementation-Title': 'CS3343 Second-Hand Trading Platform',
            'Implementation-Version': version
        )
    }
    
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    // Exclude duplicate files
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    doLast {
        println "�?FAT JAR created at: ${archiveFile.get()}"
        println "�?Run with: java -jar ${archiveFile.get()}"
    }
}

// Create Windows batch script
tasks.register('createWindowsExecutable') {
    group = 'build'
    description = 'Create Windows executable batch script'
    dependsOn fatJar
    doLast {
        def batFile = new File(projectDir, '3343-Project.bat')
        
        batFile.text = '''@echo off
REM Second-Hand Trading Platform Launcher
REM This script requires Java 25 or higher to be installed

setlocal enabledelayedexpansion

REM Check if Java is installed
java -version >nul 2>&1
if errorlevel 1 (
    echo Error: Java is not installed or not in PATH
    echo Please install Java 25 or higher from https://www.oracle.com/java/technologies/downloads/
    pause
    exit /b 1
)

REM Get the directory where this script is located
set SCRIPT_DIR=%~dp0

REM Run the application (automatically finds the JAR)
for /f "tokens=*" %%a in ('dir "%SCRIPT_DIR%build\\libs\\3343-Project-*-all.jar" /b /s 2^>nul') do (
    java -jar "%%a"
    if errorlevel 1 (
        echo.
        echo Application exited with error code %ERRORLEVEL%
        pause
    )
    goto:eof
)

echo Error: Could not find JAR file
echo Expected location: build\\libs\\3343-Project-*-all.jar
pause
endlocal
'''
        println "�?Windows batch script created: 3343-Project.bat"
        println "�?Double-click to run the application"
    }
}

// Create Linux/Mac shell script
tasks.register('createUnixExecutable') {
    group = 'build'
    description = 'Create Linux/Mac executable shell script'
    dependsOn fatJar
    doLast {
        def shFile = new File(projectDir, '3343-Project.sh')
        
        shFile.text = '''#!/bin/bash
# Second-Hand Trading Platform Launcher
# This script requires Java 25 or higher to be installed

# Check if Java is installed
if ! command -v java &> /dev/null; then
    echo "Error: Java is not installed"
    echo "Please install Java 25 or higher"
    exit 1
fi

# Get the directory where this script is located
SCRIPT_DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"

# Find and run the JAR file
JAR_FILE=$(find "$SCRIPT_DIR/build/libs" -name "3343-Project-*-all.jar" -type f | head -1)

if [ -z "$JAR_FILE" ]; then
    echo "Error: Could not find JAR file"
    echo "Expected location: build/libs/3343-Project-*-all.jar"
    exit 1
fi

# Run the application
java -jar "$JAR_FILE"
'''
        
        // Make the script executable
        shFile.setExecutable(true)
        
        println "�?Unix shell script created: 3343-Project.sh"
        println "�?Run with: chmod +x 3343-Project.sh && ./3343-Project.sh"
    }
}

// Create all executables
tasks.register('createExecutables') {
    group = 'build'
    description = 'Create all executable files (Windows batch and Unix shell script)'
    dependsOn createWindowsExecutable, createUnixExecutable
    doLast {
        println ""
        println "========================================"
        println "�?All executable files created!"
        println "========================================"
        println ""
        println "Windows Users:"
        println "  - Double-click: 3343-Project.bat"
        println "  - Or run: 3343-Project.bat"
        println ""
        println "Linux/Mac Users:"
        println "  - Run: ./3343-Project.sh"
        println ""
        println "All Platforms:"
        println "  - Use FAT JAR: java -jar build/libs/3343-Project-all.jar"
        println ""
    }
}
// Task to initialize demo data
tasks.register('initDemoData', JavaExec) {
    group = 'application'
    description = 'Initialize database with demo data'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'InitializeDemoData'
}

// ===========================
// Native Installer (jpackage)
// ===========================

// Prepare runtime image directory for jpackage
tasks.register('preparePackageDir', Copy) {
    group = 'distribution'
    description = 'Prepare directory for jpackage'
    dependsOn fatJar
    
    from("${buildDir}/libs") {
        include '3343-Project-*-all.jar'
        rename { '3343-Project.jar' }
    }
    into "${buildDir}/package/input"
}

// Copy resources for packaging (item_images to input directory for jpackage)
tasks.register('copyPackageResources') {
    group = 'distribution'
    description = 'Copy resources for package'
    dependsOn preparePackageDir
    
    doLast {
        // Copy item_images to jpackage input directory
        copy {
            from(projectDir) {
                include 'item_images/**'
            }
            into "${buildDir}/package/input"
        }
        // Also copy to resources for other packaging methods
        copy {
            from(projectDir) {
                include 'item_images/**'
                include 'secondhand.db'
            }
            into "${buildDir}/package/resources"
        }
        println "�?Resources copied to package directories"
    }
}

// Download Liberica JDK Full (includes JavaFX) for jpackage
tasks.register('downloadLibericaJDK') {
    group = 'distribution'
    description = 'Download Liberica JDK Full with JavaFX for packaging'
    
    def libericaDir = file("${buildDir}/liberica-full")
    def libericaZip = file("${buildDir}/liberica-full.zip")
    def libericaUrl = "https://download.bell-sw.com/java/21.0.5+11/bellsoft-jdk21.0.5+11-windows-amd64-full.zip"
    
    outputs.dir(libericaDir)
    
    doLast {
        if (!file("${libericaDir}/jdk-21.0.5-full").exists()) {
            println "Downloading Liberica JDK Full (with JavaFX)..."
            
            if (!libericaZip.exists()) {
                ant.get(src: libericaUrl, dest: libericaZip)
            }
            
            println "Extracting..."
            copy {
                from zipTree(libericaZip)
                into libericaDir
            }
            println "�?Liberica JDK Full ready"
        } else {
            println "�?Liberica JDK Full already exists"
        }
    }
}

// Create Windows installer using jpackage
tasks.register('jpackageWindows', Exec) {
    group = 'distribution'
    description = 'Create Windows installer (.exe) with bundled JRE - No Java installation required!'
    dependsOn preparePackageDir, copyPackageResources, downloadLibericaJDK
    
    def libericaHome = "${buildDir}/liberica-full/jdk-21.0.5-full"
    def jpackageExe = "${libericaHome}/bin/jpackage"
    def outputDir = "${buildDir}/installer"
    def inputDir = "${buildDir}/package/input"
    def resourceDir = "${buildDir}/package/resources"
    def iconFile = file("${projectDir}/resources/icon.ico")
    
    doFirst {
        // Create output directory
        file(outputDir).mkdirs()
        
        println "=========================================="
        println "Creating Windows Installer with jpackage"
        println "=========================================="
        println "Using Liberica JDK: ${libericaHome}"
        println "Input: ${inputDir}"
        println "Output: ${outputDir}"
        println "Icon: ${iconFile.exists() ? iconFile : 'Not found (using default)'}"
    }
    
    def cmdArgs = [
        jpackageExe,
        '--type', 'exe',
        '--name', 'SecondHandTrading',
        '--description', 'CS3343 Second-Hand Trading Platform',
        '--vendor', 'CS3343 Group 11',
        '--app-version', '1.5.4',
        '--input', inputDir,
        '--main-jar', '3343-Project.jar',
        '--main-class', 'MainApp',
        '--dest', outputDir,
        '--win-dir-chooser',
        '--win-menu',
        '--win-shortcut',
        // Add JavaFX modules to runtime (Liberica Full includes JavaFX)
        '--add-modules', 'javafx.controls,javafx.fxml,javafx.graphics,javafx.base,java.sql',
        '--java-options', '-Dfile.encoding=UTF-8',
        '--java-options', '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--java-options', '-Duser.language=en',
        '--java-options', '-Duser.country=US'
    ]
    
    // Add icon if exists
    if (iconFile.exists()) {
        cmdArgs += ['--icon', iconFile.absolutePath]
    }
    
    commandLine cmdArgs
    
    doLast {
        println ""
        println "�?Windows installer created at: ${outputDir}"
        println "�?Users can install without Java!"
        println ""
    }
}

// Create portable package using jpackage app-image (with embedded JRE)
tasks.register('jpackagePortable', Exec) {
    group = 'distribution'
    description = 'Create portable app-image with bundled JRE using jpackage'
    dependsOn preparePackageDir, copyPackageResources, downloadLibericaJDK
    
    def libericaHome = "${buildDir}/liberica-full/jdk-21.0.5-full"
    def jpackageExe = "${libericaHome}/bin/jpackage"
    def outputDir = "${buildDir}/jpackage/app-image"
    def inputDir = "${buildDir}/package/input"
    def iconFile = file("${projectDir}/resources/icon.ico")
    
    doFirst {
        file(outputDir).mkdirs()
        // Clean previous app-image
        delete "${outputDir}/SecondHandTrading"
        println "=========================================="
        println "Creating Portable App Image with jpackage"
        println "=========================================="
        println "Using Liberica JDK: ${libericaHome}"
    }
    
    def cmdArgs = [
        jpackageExe,
        '--type', 'app-image',
        '--name', 'SecondHandTrading',
        '--description', 'CS3343 Second-Hand Trading Platform',
        '--vendor', 'CS3343 Group 11',
        '--app-version', '1.5.4',
        '--input', inputDir,
        '--main-jar', '3343-Project.jar',
        '--main-class', 'MainApp',
        '--dest', outputDir,
        // Add JavaFX modules to runtime (Liberica Full includes JavaFX)
        '--add-modules', 'javafx.controls,javafx.fxml,javafx.graphics,javafx.base,java.sql',
        '--java-options', '-Dfile.encoding=UTF-8',
        '--java-options', '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--java-options', '-Duser.language=en',
        '--java-options', '-Duser.country=US'
    ]
    
    if (iconFile.exists()) {
        cmdArgs += ['--icon', iconFile.absolutePath]
    }
    
    commandLine cmdArgs
    
    doLast {
        // Copy item_images and database to the app directory
        def appDir = file("${outputDir}/SecondHandTrading")
        copy {
            from projectDir
            include 'item_images/**'
            into appDir
        }
        println "�?Portable app-image created at: ${appDir}"
        println "�?Item images copied to app directory"
    }
}

// Create portable package (JAR + JRE + resources) - Legacy method
tasks.register('createPortablePackage') {
    group = 'distribution'
    description = 'Create portable package with embedded JRE'
    dependsOn fatJar
    
    doLast {
        def portableDir = file("${buildDir}/portable/SecondHandTrading")
        portableDir.mkdirs()
        
        // Copy JAR
        copy {
            from "${buildDir}/libs"
            include '3343-Project-*-all.jar'
            into portableDir
            rename { '3343-Project.jar' }
        }
        
        // Copy resources
        copy {
            from projectDir
            include 'item_images/**'
            include 'secondhand.db'
            include 'launch.bat'
            into portableDir
        }
        
        // Create launcher script
        def launcher = new File(portableDir, 'Start.bat')
        launcher.text = '''@echo off
chcp 65001 >nul
cd /d "%~dp0"

echo ========================================
echo   Second-Hand Trading Platform
echo ========================================
echo.

REM Try to find Java 21+
set "JAVA_EXE="

REM Check bundled JRE first
if exist "jre\\bin\\java.exe" (
    set "JAVA_EXE=jre\\bin\\java.exe"
    goto :run
)

REM Check JAVA_HOME
if defined JAVA_HOME (
    if exist "%JAVA_HOME%\\bin\\java.exe" (
        set "JAVA_EXE=%JAVA_HOME%\\bin\\java.exe"
        goto :run
    )
)

REM Check PATH
where java >nul 2>&1
if %errorlevel%==0 (
    set "JAVA_EXE=java"
    goto :run
)

echo [ERROR] Java not found!
echo Please install Java 21+ from: https://adoptium.net/temurin/releases/?version=21
pause
exit /b 1

:run
echo Starting application...
"%JAVA_EXE%" -Dfile.encoding=UTF-8 -jar 3343-Project.jar
if %errorlevel% neq 0 pause
'''
        
        println ""
        println "�?Portable package created at: ${portableDir}"
        println "�?Contents:"
        println "  - 3343-Project.jar (main application)"
        println "  - Start.bat (launcher)"
        println "  - item_images/ (product images)"
        println "  - secondhand.db (database)"
        println ""
    }
}

// Create distribution ZIP
tasks.register('createDistZip', Zip) {
    group = 'distribution'
    description = 'Create distribution ZIP file'
    dependsOn createPortablePackage
    
    archiveFileName = 'SecondHandTrading-Portable-v1.3.zip'
    destinationDirectory = file("${buildDir}/dist")
    
    from("${buildDir}/portable")
    
    doLast {
        println "�?Distribution ZIP created: ${destinationDirectory.get()}/${archiveFileName.get()}"
    }
}
