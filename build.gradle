plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '25.0.1'   // 使用最新版本或与你的 JDK 兼容的版本
}

group = 'com.example'
version = '25.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25) // 根据你的 JDK 调整（11/17/21）
    }
}

application {
    mainClass = 'MainApp' // 你的 JavaFX Application 入口
    applicationDefaultJvmArgs = [
        '--module-path', '/Users/liyuan/Downloads/javafx-sdk-25.0.1/lib',
        '--add-modules', 'javafx.controls,javafx.fxml'
    ]
}

repositories {
    mavenCentral()
}

dependencies {
    // 使用本地 JavaFX SDK
    implementation files('/Users/liyuan/Downloads/javafx-sdk-25.0.1/lib/javafx.base.jar')
    implementation files('/Users/liyuan/Downloads/javafx-sdk-25.0.1/lib/javafx.controls.jar')
    implementation files('/Users/liyuan/Downloads/javafx-sdk-25.0.1/lib/javafx.fxml.jar')
    implementation files('/Users/liyuan/Downloads/javafx-sdk-25.0.1/lib/javafx.graphics.jar')
    
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    implementation 'org.slf4j:slf4j-simple:2.0.16'       // 可选：日志

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
}

javafx {
    version = '25.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}